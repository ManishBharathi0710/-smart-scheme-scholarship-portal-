version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: smart_scheme_prod_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres_secure_pass_2026}
      POSTGRES_DB: ${DB_NAME:-smart_scheme_db}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-postgres}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - portal_internal_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smart_scheme_prod_backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5001
      API_PREFIX: /api/v1
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres_secure_pass_2026}@postgres:5432/${DB_NAME:-smart_scheme_db}?schema=public
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost,http://localhost:80}
      JWT_SECRET: ${JWT_SECRET:-production_default_strong_jwt_secret_key_at_least_64_chars_long}
      REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET:-production_default_strong_refresh_secret_key_at_least_64_chars}
      DOCUMENT_STORAGE_PATH: uploads/documents
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - document_storage:/app/uploads/documents
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:5001/health']
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - portal_internal_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: smart_scheme_prod_frontend
    restart: unless-stopped
    ports:
      - '80:80'
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - portal_internal_net

volumes:
  postgres_prod_data:
    driver: local
  document_storage:
    driver: local

networks:
  portal_internal_net:
    driver: bridge
